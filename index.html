<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
    <img src="https://stardewvalleywiki.com/mediawiki/images/6/68/Main_Logo.png" alt="Imagen del nombre del juego Stardew Valley">
    <h2><a href="https://es.stardewvalleywiki.com/Lotes" target="_blank">Los mejores lotes y recompensas del Centro Comunitario</a></h2>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="Salademanualidades"><label for="Salademanualidades">Sala de manualidades</label>
            <ul class="sub-item">
                <li>Recompensa de la Sala de manualidades: <a class="sub-item-link" href="https://es.stardewvalleywiki.com/Cantera" target="_blank">Puente reparado</a></li></ul>
        </li>

        <li>
            <input type="checkbox" id="Alacena">
            <label for="Alacena">Alacena</label>
            <ul class="sub-item">
                <li>Recompensa de la Alacena: <a class="sub-item-link" href="https://es.stardewvalleywiki.com/Invernadero" target="_blank">Invernadero</a></li>
        </ul>

        <li>
            <input type="checkbox" id="Tablondeanuncios"><label for="Tablondeanuncios">Tablón de anuncios</label>
            <ul class="sub-item">
                <li>Recompensa del Tablón de anuncios: <a class="sub-item-link" href="https://es.stardewvalleywiki.com/Bateas" target="_blank">Amistad ♡</a></ul>
        </li>

        <li>
            <input type="checkbox" id="Saladecaldera"><label for="Saladecaldera">Sala de caldera</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://es.stardewvalleywiki.com/Vagoneta" target="_blank">Vagonetas</a> reparadas</ul>
        </li>
    </ul>
    </div>
</body>

</html>
